name: Automated Job Scraper

on:
  schedule:
    # Run every 12 hours at 00:00 and 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Cleanup old jobs (30+ days)
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || secrets.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_API_URL" ]; then
            CLEANUP_URL=$(echo "$BACKEND_API_URL" | sed 's|/batch|/cleanup|')
            echo "🧹 Cleaning up old jobs from $CLEANUP_URL..."
            curl -s -X DELETE "$CLEANUP_URL" || echo "⚠️ Cleanup failed (non-critical)"
          else
            echo "⚠️ BACKEND_API_URL secret not set. Skipping remote cleanup."
          fi

      - name: Run Job Scraper
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || secrets.BACKEND_URL }}
        run: |
          cd scrapers
          go run cmd/scraper/main.go

      - name: Notify completion
        run: |
          echo "✅ Job scraper completed successfully!"
          echo "Jobs have been sent to the backend."
